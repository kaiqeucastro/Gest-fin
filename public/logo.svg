<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background shape: rounded square com corte diagonal no canto inferior direito -->
  <path d="M20 16C20 7.163 27.163 0 36 0h128c8.837 0 16 7.163 16 16v128l-56 56H36C27.163 200 20 192.837 20 184V16z" fill="#315d4c"/>

  <!-- Linha de gráfico subindo (trend line) -->
  <polyline
    points="44,138 76,108 100,120 130,72 156,52"
    stroke="rgba(255,255,255,0.25)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Barras de gráfico -->
  <rect x="44" y="106" width="18" height="32" rx="3" fill="rgba(255,255,255,0.18)"/>
  <rect x="72" y="88"  width="18" height="50" rx="3" fill="rgba(255,255,255,0.28)"/>
  <rect x="100" y="72" width="18" height="66" rx="3" fill="rgba(255,255,255,0.38)"/>
  <rect x="128" y="54" width="18" height="84" rx="3" fill="rgba(255,255,255,0.55)"/>

  <!-- Seta de tendência no topo -->
  <path d="M138 46 L156 46 L156 64" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="138" y1="64" x2="156" y2="46" stroke="white" stroke-width="4" stroke-linecap="round"/>

  <!-- Corte diagonal decorativo no canto inferior direito -->
  <path d="M164 200 L200 164 L200 200 Z" fill="#203f35" opacity="0.6"/>
</svg>
